<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>H2H SONG SORT</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #f7f7f7;
        color: #111;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Pretendard",
            "Apple SD Gothic Neo",
            "Noto Sans KR",
            sans-serif;
    }

    button {
        font-family: inherit;
    }

    .container {
        width: min(680px, 100%);
        margin: 0 auto;
        padding: 24px 16px 50px;
    }

    /* =========================
       START
    ========================= */

    #startScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .startBox {
        width: 100%;
    }

    .logo {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -1.8px;
        margin-bottom: 8px;
    }

    .startDescription {
        color: #888;
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .songCount {
        color: #aaa;
        font-size: 12px;
        margin-bottom: 22px;
    }

    .startButton {
        border: 0;
        background: #111;
        color: white;
        border-radius: 999px;
        padding: 15px 34px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform .15s ease;
    }

    .startButton:active {
        transform: scale(.95);
    }

    /* =========================
       SORT
    ========================= */

    #sortScreen {
        display: none;
    }

    .header {
        text-align: center;
        margin: 10px 0 24px;
    }

    .headerTitle {
        font-size: 23px;
        font-weight: 850;
        letter-spacing: -1px;
    }

    .headerSub {
        margin-top: 7px;
        font-size: 12px;
        color: #999;
    }

    .progressArea {
        margin-top: 18px;
    }

    .progressInfo {
        display: flex;
        justify-content: space-between;
        color: #999;
        font-size: 11px;
        margin-bottom: 7px;
    }

    .progressBar {
        width: 100%;
        height: 4px;
        background: #e6e6e6;
        border-radius: 999px;
        overflow: hidden;
    }

    .progressFill {
        height: 100%;
        width: 0%;
        background: #111;
        border-radius: 999px;
        transition: width .25s ease;
    }

    .battle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 24px;
    }

    .songCard {
        position: relative;
        min-height: 260px;
        border: 1px solid #dedede;
        border-radius: 20px;
        background: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 22px 13px;
        cursor: pointer;
        overflow: hidden;
        transition:
            transform .15s ease,
            border-color .15s ease,
            background .15s ease;
    }

    .songCard:active {
        transform: scale(.96);
    }

    .songCard.selected {
        border-color: #111;
        background: #111;
        color: white;
    }

    .sideLabel {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        font-weight: 800;
        color: #aaa;
        letter-spacing: .8px;
    }

    .selected .sideLabel {
        color: #777;
    }

    .songName {
        font-size: 17px;
        font-weight: 750;
        line-height: 1.45;
        text-align: center;
        word-break: keep-all;
    }

    .tapText {
        position: absolute;
        bottom: 14px;
        font-size: 10px;
        color: #aaa;
    }

    .selected .tapText {
        color: #777;
    }

    .compareNumber {
        text-align: center;
        margin-top: 18px;
        color: #aaa;
        font-size: 11px;
    }

    /* =========================
       RESULT
    ========================= */

    #resultScreen {
        display: none;
    }

    .resultTop {
        text-align: center;
        margin: 15px 0 28px;
    }

    .resultTitle {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -1.5px;
    }

    .resultSub {
        margin-top: 7px;
        color: #999;
        font-size: 12px;
    }

    .ranking {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .rankItem {
        width: 100%;
        min-height: 61px;
        background: white;
        border: 1px solid #e9e9e9;
        border-radius: 15px;
        display: flex;
        align-items: center;
        padding: 10px 14px;
    }

    .rankNumber {
        width: 40px;
        flex-shrink: 0;
        font-size: 14px;
        font-weight: 850;
        color: #aaa;
        text-align: center;
    }

    .rankItem:first-child .rankNumber {
        color: #111;
    }

    .rankSong {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
        word-break: keep-all;
    }

    .restartArea {
        text-align: center;
        margin-top: 28px;
    }

    .restartButton {
        border: 0;
        background: #111;
        color: white;
        border-radius: 999px;
        padding: 14px 30px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    @media (max-width: 420px) {

        .container {
            padding-left: 12px;
            padding-right: 12px;
        }

        .logo {
            font-size: 29px;
        }

        .battle {
            gap: 8px;
        }

        .songCard {
            min-height: 220px;
            border-radius: 17px;
            padding-left: 9px;
            padding-right: 9px;
        }

        .songName {
            font-size: 15px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- =====================
         시작 화면
    ====================== -->

    <section id="startScreen">

        <div class="startBox">

            <div class="logo">
                H2H SONG SORT
            </div>

            <div class="startDescription">
                두 곡 중 더 좋아하는 곡을 골라주세요.<br>
                모든 선택이 끝나면 나만의 순위가 완성됩니다.
            </div>

            <div class="songCount">
                KISS OF LIFE · 49 SONGS
            </div>

            <button class="startButton" onclick="startSort()">
                START
            </button>

        </div>

    </section>


    <!-- =====================
         소트 화면
    ====================== -->

    <section id="sortScreen">

        <div class="header">

            <div class="headerTitle">
                Which one do you prefer?
            </div>

            <div class="headerSub">
                두 곡 중 하나를 선택하세요
            </div>

            <div class="progressArea">

                <div class="progressInfo">
                    <span id="progressText">진행 중</span>
                    <span id="compareText">0회 비교</span>
                </div>

                <div class="progressBar">
                    <div
                        class="progressFill"
                        id="progressFill">
                    </div>
                </div>

            </div>

        </div>


        <div class="battle">

            <button
                class="songCard"
                id="cardA"
                onclick="selectSong(0)"
            >

                <div class="sideLabel">
                    A
                </div>

                <div
                    class="songName"
                    id="songA">
                </div>

                <div class="tapText">
                    TAP TO CHOOSE
                </div>

            </button>


            <button
                class="songCard"
                id="cardB"
                onclick="selectSong(1)"
            >

                <div class="sideLabel">
                    B
                </div>

                <div
                    class="songName"
                    id="songB">
                </div>

                <div class="tapText">
                    TAP TO CHOOSE
                </div>

            </button>

        </div>


        <div class="compareNumber">
            선택할 때마다 자동으로 다음 대결로 넘어갑니다
        </div>

    </section>


    <!-- =====================
         결과 화면
    ====================== -->

    <section id="resultScreen">

        <div class="resultTop">

            <div class="resultTitle">
                YOUR RESULT
            </div>

            <div class="resultSub">
                KISS OF LIFE SONG RANKING
            </div>

        </div>


        <div
            class="ranking"
            id="ranking">
        </div>


        <div class="restartArea">

            <button
                class="restartButton"
                onclick="restart()"
            >
                다시 하기
            </button>

        </div>

    </section>

</div>


<script>

/* =====================================================
   SONG LIST
   BREAK IT 중복 1개 제거
===================================================== */

const songs = [
    "쉿 (Shhh)",
    "안녕, 네버랜드",
    "sugarcoat",
    "countdown",
    "Kitty cat",
    "Play Love Games",
    "Bad News",
    "Nobody Knows",
    "My 808",
    "TTG",
    "Gentleman",
    "Says it",
    "Bad News (ENG Ver.)",
    "Midas Touch",
    "Nothing",
    "Sticky",
    "Te Quiero",
    "Get Loud",
    "Chemistry",
    "Igloo",
    "Too Many Alex",
    "Back To Me",
    "No One But Us",
    "R.E.M",
    "Live, Love, Laugh",
    "W.House",
    "Lips Hips Kiss",
    "Tell Me",
    "k bye",
    "Painting",
    "Slide",
    "Heart of Gold",
    "Think Twice",
    "Lucky (Korean Ver.)",
    "Lucky",
    "Sticky (Japanese Ver.)",
    "Midas Touch (Japanese Ver.)",
    "Shhh (Japanese Ver.)",
    "Nobody knows (Japanese Ver.)",
    "Nobody Knows (Remix)",
    "R.E.M (Remix)",
    "Who is she",
    "Don't mind me",
    "SWEAT",
    "WHAT!",
    "BREAK IT",
    "SWEAT (Japanese Ver.)",
    "Was It You",
    "Who is she (Japanese Ver.)",
    "Igloo (Remix)",
    "BREAK IT (English Ver.)"
];


/* =====================================================
   상태값
===================================================== */

let currentComparison = 0;
let currentA = null;
let currentB = null;

let totalExpectedComparisons = 0;


/* =====================================================
   Fisher-Yates 랜덤 셔플
===================================================== */

function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] =
            [copy[j], copy[i]];
    }

    return copy;
}


/* =====================================================
   시작
===================================================== */

function startSort() {

    document.getElementById("startScreen").style.display =
        "none";

    document.getElementById("resultScreen").style.display =
        "none";

    document.getElementById("sortScreen").style.display =
        "block";


    currentComparison = 0;


    /*
        처음 시작할 때 곡 순서를 랜덤으로 섞음.
        같은 순서에서 시작하는 편향을 줄이기 위한 것.
    */

    const shuffled = shuffle(songs);


    /*
        Merge Sort를 Promise 방식으로 실행.
        사용자가 버튼을 누를 때까지
        다음 비교를 기다림.
    */

    totalExpectedComparisons =
        Math.ceil(songs.length * Math.log2(songs.length));


    runSort(shuffled);
}


/* =====================================================
   사용자 선택을 기다리는 함수
===================================================== */

function askUser(a, b) {

    return new Promise(resolve => {

        currentA = a;
        currentB = b;

        window.currentResolve = resolve;

        showComparison(a, b);
    });
}


/* =====================================================
   화면에 두 곡 표시
===================================================== */

function showComparison(a, b) {

    document.getElementById("songA").textContent = a;
    document.getElementById("songB").textContent = b;

    document.getElementById("cardA")
        .classList.remove("selected");

    document.getElementById("cardB")
        .classList.remove("selected");


    document.getElementById("compareText").textContent =
        currentComparison + "회 비교";


    /*
        정확한 총 비교 횟수는
        사용자의 선택에 따라 조금씩 달라질 수 있으므로
        진행률은 예상치 기준으로 표시.
    */

    const percent = Math.min(
        (currentComparison / totalExpectedComparisons) * 100,
        96
    );

    document.getElementById("progressFill").style.width =
        percent + "%";
}


/* =====================================================
   곡 선택
===================================================== */

function selectSong(which) {

    if (!window.currentResolve) return;


    const card =
        which === 0
            ? document.getElementById("cardA")
            : document.getElementById("cardB");


    card.classList.add("selected");


    const winner =
        which === 0
            ? currentA
            : currentB;


    const loser =
        which === 0
            ? currentB
            : currentA;


    const resolve =
        window.currentResolve;


    window.currentResolve = null;


    currentComparison++;


    /*
        잠깐 선택 효과를 보여준 다음
        다음 비교로 이동.
    */

    setTimeout(() => {

        resolve({
            winner: winner,
            loser: loser
        });

    }, 130);

}


/* =====================================================
   MERGE SORT
===================================================== */

async function mergeSort(array) {

    if (array.length <= 1) {
        return array;
    }


    const middle =
        Math.floor(array.length / 2);


    const left =
        await mergeSort(array.slice(0, middle));


    const right =
        await mergeSort(array.slice(middle));


    return await merge(left, right);
}


/* =====================================================
   두 그룹 합치기
===================================================== */

async function merge(left, right) {

    const sorted = [];

    let i = 0;
    let j = 0;


    while (
        i < left.length &&
        j < right.length
    ) {

        const choice =
            await askUser(
                left[i],
                right[j]
            );


        if (choice.winner === left[i]) {

            sorted.push(left[i]);
            i++;

        } else {

            sorted.push(right[j]);
            j++;

        }

    }


    /*
        남은 곡들은 이미 순서가 정해져 있으므로
        추가 비교 없이 넣음.
    */

    while (i < left.length) {

        sorted.push(left[i]);
        i++;

    }


    while (j < right.length) {

        sorted.push(right[j]);
        j++;

    }


    return sorted;
}


/* =====================================================
   전체 소트 실행
===================================================== */

async function runSort(shuffledSongs) {

    const result =
        await mergeSort(shuffledSongs);


    showResult(result);
}


/* =====================================================
   결과 화면
===================================================== */

function showResult(result) {

    document.getElementById("sortScreen").style.display =
        "none";

    document.getElementById("resultScreen").style.display =
        "block";


    document.getElementById("progressFill").style.width =
        "100%";


    const ranking =
        document.getElementById("ranking");


    ranking.innerHTML = "";


    result.forEach((song, index) => {

        const item =
            document.createElement("div");


        item.className = "rankItem";


        const number =
            document.createElement("div");

        number.className = "rankNumber";

        number.textContent =
            index + 1;


        const name =
            document.createElement("div");

        name.className = "rankSong";

        name.textContent =
            song;


        item.appendChild(number);
        item.appendChild(name);

        ranking.appendChild(item);

    });

}


/* =====================================================
   다시 하기
===================================================== */

function restart() {

    document.getElementById("resultScreen").style.display =
        "none";

    document.getElementById("sortScreen").style.display =
        "none";

    document.getElementById("startScreen").style.display =
        "flex";

    currentComparison = 0;
    currentA = null;
    currentB = null;
    window.currentResolve = null;

    document.getElementById("progressFill").style.width =
        "0%";
}

</script>

</body>
</html>
