<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISS OF LIFE SONG SORT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 16px;
}

h1 {
  font-size: 28px;
  margin: 20px 0 10px;
}

.subtitle {
  color: #777;
  margin-bottom: 35px;
}

#sortArea {
  display: none;
}

.progress {
  margin-bottom: 20px;
  font-size: 14px;
  color: #777;
}

.choices {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: stretch;
}

.song {
  width: 50%;
  min-height: 180px;
  border: 1px solid #ddd;
  border-radius: 15px;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.15s;
}

.song:hover {
  background: #f5f5f5;
  transform: translateY(-2px);
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 15px;
}

.buttons button,
.start button,
.restart {
  border: 1px solid #ddd;
  background: white;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
}

.buttons button:hover,
.start button:hover,
.restart:hover {
  background: #f3f3f3;
}

.start button {
  font-size: 17px;
  padding: 14px 30px;
}

#result {
  display: none;
}

.result-list {
  text-align: left;
  margin-top: 30px;
}

.result-item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px 10px;
  border-bottom: 1px solid #eee;
}

.rank {
  width: 35px;
  font-weight: bold;
  color: #888;
}

.song-name {
  font-size: 16px;
}

.first {
  font-size: 20px;
  font-weight: bold;
}

@media (max-width: 500px) {
  .song {
    min-height: 150px;
    font-size: 17px;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- 시작 화면 -->
  <div id="start" class="start">
    <h1>KISS OF LIFE<br>SONG SORT</h1>
    <p class="subtitle">좋아하는 곡을 골라주세요</p>
    <button onclick="startSort()">START</button>
  </div>

  <!-- 정렬 화면 -->
  <div id="sortArea">

    <div class="progress">
      <span id="progress">1</span>번째 비교
    </div>

    <div class="choices">
      <div class="song" id="leftSong" onclick="choose(0)"></div>
      <div class="song" id="rightSong" onclick="choose(1)"></div>
    </div>

    <div class="buttons">
      <button onclick="choose(2)">둘 다 좋다</button>
      <button onclick="choose(3)">모르겠다</button>
    </div>

  </div>

  <!-- 결과 -->
  <div id="result">
    <h1>RESULT</h1>
    <p class="subtitle">KISS OF LIFE SONG RANKING</p>

    <div id="resultList" class="result-list"></div>

    <button class="restart" onclick="location.reload()">
      다시 하기
    </button>
  </div>

</div>

<script>

const songs = [
  "쉿 (Shhh)",
  "안녕, 네버랜드",
  "sugarcoat",
  "countdown",
  "Kitty cat",
  "Play Love Games",
  "Bad News",
  "Nobody Knows",
  "My 808",
  "TTG",
  "Gentleman",
  "Says it",
  "Bad News (ENG Ver.)",
  "Midas Touch",
  "Nothing",
  "Sticky",
  "Te Quiero",
  "Get Loud",
  "Chemistry",
  "Igloo",
  "Too Many Alex",
  "Back To Me",
  "No One But Us",
  "R.E.M",
  "Live, Love, Laugh",
  "W.House",
  "Lips Hips Kiss",
  "Tell Me",
  "k bye",
  "Painting",
  "Slide",
  "Heart of Gold",
  "Think Twice",
  "Lucky",
  "Who is she",
  "Don't mind me",
  "SWEAT",
  "WHAT!",
  "BREAK IT",
  "Was It You"
];

let items = [];
let currentPair = [];
let comparisons = 0;

/*
  Merge Sort 방식
  ----------------
  두 곡을 비교하고,
  선택된 쪽을 앞에 넣는다.

  "둘 다 좋다" → 두 곡을 같은 그룹으로 처리
  "모르겠다" → 랜덤하게 처리
*/

function startSort() {

  document.getElementById("start").style.display = "none";
  document.getElementById("sortArea").style.display = "block";

  items = songs.map((song, index) => ({
    name: song,
    index: index
  }));

  mergeSortStart();
}

function mergeSortStart() {

  // 정렬용 배열을 복사
  let shuffled = [...items];

  // 랜덤 셔플
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  items = shuffled;

  // 실제 정렬 시작
  sortGroups([items]);
}

let groups = [];
let nextGroups = [];

function sortGroups(initial) {

  groups = [];

  // 각 곡을 하나의 그룹으로 만든다
  for (const song of items) {
    groups.push([song]);
  }

  nextGroups = [];
  mergeRound();
}

function mergeRound() {

  if (groups.length <= 1) {
    showResult(groups[0]);
    return;
  }

  nextGroups = [];
  let i = 0;

  function processNext() {

    if (i >= groups.length) {
      groups = nextGroups;
      mergeRound();
      return;
    }

    const left = groups[i];
    const right = groups[i + 1];

    if (!right) {
      nextGroups.push(left);
      i += 2;
      processNext();
      return;
    }

    mergeTwo(left, right, function(result) {
      nextGroups.push(result);
      i += 2;
      processNext();
    });
  }

  processNext();
}

function mergeTwo(left, right, callback) {

  let result = [];
  let l = 0;
  let r = 0;

  function ask() {

    if (l >= left.length) {
      result = result.concat(right.slice(r));
      callback(result);
      return;
    }

    if (r >= right.length) {
      result = result.concat(left.slice(l));
      callback(result);
      return;
    }

    currentPair = [left[l], right[r]];

    document.getElementById("leftSong").textContent =
      currentPair[0].name;

    document.getElementById("rightSong").textContent =
      currentPair[1].name;

    document.getElementById("progress").textContent =
      comparisons + 1;

    window.currentCallback = function(choice) {

      comparisons++;

      if (choice === 0) {
        result.push(left[l]);
        l++;

      } else if (choice === 1) {
        result.push(right[r]);
        r++;

      } else if (choice === 2) {
        // 둘 다 좋다
        // 두 곡을 같은 우선순위로 넣음
        result.push(left[l]);
        result.push(right[r]);

        l++;
        r++;

      } else if (choice === 3) {
        // 모르겠다
        // 둘 중 하나를 랜덤으로 선택
        if (Math.random() < 0.5) {
          result.push(left[l]);
          l++;
        } else {
          result.push(right[r]);
          r++;
        }
      }

      ask();
    };
  }

  ask();
}

function choose(choice) {

  if (window.currentCallback) {
    const callback = window.currentCallback;
    window.currentCallback = null;
    callback(choice);
  }
}

function showResult(result) {

  document.getElementById("sortArea").style.display = "none";
  document.getElementById("result").style.display = "block";

  const list = document.getElementById("resultList");
  list.innerHTML = "";

  result.forEach((song, index) => {

    const item = document.createElement("div");
    item.className = "result-item";

    if (index === 0) {
      item.classList.add("first");
    }

    item.innerHTML = `
      <div class="rank">${index + 1}</div>
      <div class="song-name">${song.name}</div>
    `;

    list.appendChild(item);
  });
}

</script>

</body>
</html>
