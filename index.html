<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KISS OF LIFE SONG SORT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: #111;
  font-family: Arial, sans-serif;
  text-align: center;
}

#app {
  width: min(92%, 900px);
  margin: 0 auto;
  padding: 35px 0;
}

h1 {
  font-size: 24px;
  margin: 0 0 35px;
}

#counter {
  font-size: 13px;
  color: #888;
  margin-bottom: 15px;
}

#choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.choice {
  min-height: 180px;
  border: 1px solid #ddd;
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-size: 18px;
  transition: .15s;
}

.choice:hover {
  background: #f7f7f7;
}

#buttons {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 8px;
}

#buttons button,
#restart {
  border: 0;
  background: #eee;
  padding: 9px 16px;
  cursor: pointer;
  font-size: 13px;
}

#result {
  display: none;
}

#result h2 {
  margin-bottom: 25px;
}

.rank {
  display: grid;
  grid-template-columns: 45px 1fr;
  text-align: left;
  border-bottom: 1px solid #eee;
  padding: 12px 5px;
}

.rank-number {
  color: #888;
}

.song {
  font-size: 15px;
}

#restart {
  margin-top: 25px;
}

@media (max-width: 600px) {
  #app {
    padding-top: 25px;
  }

  .choice {
    min-height: 150px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="sort">
    <h1>KISS OF LIFE SONG SORT</h1>

    <div id="counter"></div>

    <div id="choices">
      <div class="choice" id="left" onclick="selectSong(0)"></div>
      <div class="choice" id="right" onclick="selectSong(1)"></div>
    </div>

    <div id="buttons">
      <button onclick="selectSong(2)">둘 다 좋아</button>
      <button onclick="selectSong(3)">모르겠다</button>
    </div>
  </div>

  <div id="result">
    <h2>RESULT</h2>
    <div id="ranking"></div>
    <button id="restart" onclick="location.reload()">다시 하기</button>
  </div>

</div>

<script>

const songs = [
  "쉿 (Shhh)",
  "안녕, 네버랜드",
  "sugarcoat",
  "countdown",
  "Kitty cat",
  "Play Love Games",
  "Bad News",
  "Nobody Knows",
  "My 808",
  "TTG",
  "Gentleman",
  "Says it",
  "Bad News (ENG Ver.)",
  "Midas Touch",
  "Nothing",
  "Sticky",
  "Te Quiero",
  "Get Loud",
  "Chemistry",
  "Igloo",
  "Too Many Alex",
  "Back To Me",
  "No One But Us",
  "R.E.M",
  "Live, Love, Laugh",
  "W.House",
  "Lips Hips Kiss",
  "Tell Me",
  "k bye",
  "Painting",
  "Slide",
  "Heart of Gold",
  "Think Twice",
  "Lucky",
  "Who is she",
  "Don't mind me",
  "SWEAT",
  "WHAT!",
  "BREAK IT",
  "Was It You"
];

let groups;
let nextGroups;
let currentLeft;
let currentRight;
let result;
let comparisons = 0;

function shuffle(array) {
  array = [...array];

  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}

function start() {

  const shuffled = shuffle(songs);

  groups = shuffled.map(song => [song]);
  nextGroups = [];
  comparisons = 0;

  nextRound();
}

function nextRound() {

  if (groups.length === 1) {
    showResult(groups[0]);
    return;
  }

  nextGroups = [];
  mergeIndex = 0;

  mergeNext();
}

let mergeIndex = 0;

function mergeNext() {

  if (mergeIndex >= groups.length) {
    groups = nextGroups;
    nextRound();
    return;
  }

  const leftGroup = groups[mergeIndex];
  const rightGroup = groups[mergeIndex + 1];

  mergeIndex += 2;

  if (!rightGroup) {
    nextGroups.push(leftGroup);
    mergeNext();
    return;
  }

  mergeGroups(leftGroup, rightGroup);
}

let leftIndex;
let rightIndex;
let merged;

function mergeGroups(leftGroup, rightGroup) {

  leftIndex = 0;
  rightIndex = 0;
  merged = [];

  ask();
}

function ask() {

  if (leftIndex >= groupsLeft.length) {
    merged.push(...groupsRight.slice(rightIndex));
    nextGroups.push(merged);
    mergeNext();
    return;
  }

  if (rightIndex >= groupsRight.length) {
    merged.push(...groupsLeft.slice(leftIndex));
    nextGroups.push(merged);
    mergeNext();
    return;
  }

  currentLeft = groupsLeft[leftIndex];
  currentRight = groupsRight[rightIndex];

  document.getElementById("left").textContent = currentLeft;
  document.getElementById("right").textContent = currentRight;

  comparisons++;

  document.getElementById("counter").textContent =
    comparisons + "번째 비교";
}

let groupsLeft;
let groupsRight;

const originalMergeGroups = mergeGroups;

mergeGroups = function(leftGroup, rightGroup) {

  groupsLeft = leftGroup;
  groupsRight = rightGroup;

  leftIndex = 0;
  rightIndex = 0;
  merged = [];

  ask();
};

function selectSong(choice) {

  if (choice === 0) {

    merged.push(groupsLeft[leftIndex]);
    leftIndex++;

  } else if (choice === 1) {

    merged.push(groupsRight[rightIndex]);
    rightIndex++;

  } else if (choice === 2) {

    // 둘 다 좋아
    // 두 곡을 같은 위치에 넣는다.
    merged.push(groupsLeft[leftIndex]);
    merged.push(groupsRight[rightIndex]);

    leftIndex++;
    rightIndex++;

  } else if (choice === 3) {

    // 모르겠다
    // 무작위로 하나를 우선 배치한다.
    if (Math.random() < 0.5) {
      merged.push(groupsLeft[leftIndex]);
      leftIndex++;
    } else {
      merged.push(groupsRight[rightIndex]);
      rightIndex++;
    }
  }

  ask();
}

function showResult(ranking) {

  document.getElementById("sort").style.display = "none";
  document.getElementById("result").style.display = "block";

  const container = document.getElementById("ranking");

  container.innerHTML = "";

  ranking.forEach((song, index) => {

    const row = document.createElement("div");
    row.className = "rank";

    row.innerHTML = `
      <div class="rank-number">${index + 1}</div>
      <div class="song">${song}</div>
    `;

    container.appendChild(row);
  });
}

start();

</script>

</body>
</html>
